<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Punto de Venta - Frontend">
  <title>NovaPOS | Sistema de Punto de Venta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="app-shell">

    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu icon-button" id="mobileMenu" aria-label="Abrir menú">☰</button>
        <div class="brand">
          <div class="brand-mark">N</div>
          <div><strong>NovaPOS</strong><small>Gestión comercial</small></div>
        </div>
        <div class="breadcrumbs"><span>NovaPOS</span><span class="crumb-sep">/</span><strong id="breadcrumbCurrent">Panel principal</strong></div>
      </div>
      <div class="topbar-actions">
        <div class="connection-status"><span class="status-dot"></span><span id="connectionLabel">Vista previa local</span></div>
        <button class="icon-button notification-button" id="alertsButton" aria-label="Ver alertas">♧<i></i></button>
        <div class="user-chip"><div class="top-avatar">AD</div><span>Administrador</span></div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="nav-menu" aria-label="Navegación principal">
        <button class="nav-link active" data-view="dashboard">Panel principal</button>
        <button class="nav-link" data-view="pos">Punto de venta <span class="nav-pill">POS</span></button>
        <button class="nav-link" data-view="products">Productos</button>
        <button class="nav-link" data-view="categories">Categorías</button>
        <button class="nav-link" data-view="customers">Clientes</button>
        <button class="nav-link" data-view="suppliers">Proveedores</button>
        <div class="nav-divider"></div>
        <button class="nav-link" data-view="purchases">Compras</button>
        <button class="nav-link" data-view="sales">Ventas</button>
        <button class="nav-link" data-view="inventory">Inventario</button>
        <button class="nav-link" data-view="cash">Control de caja</button>
        <button class="nav-link" data-view="invoices">Facturas y documentos</button>
        <div class="nav-divider"></div>
        <button class="nav-link" data-view="reports">Reportes</button>
        <button class="nav-link" data-view="users">Usuarios y roles</button>
      </nav>
    </aside>

    <main class="main-area">
      <section class="content" id="appContent" aria-live="polite"></section>
      <footer class="footer"><span>NovaPOS · Sistema de Punto de Venta</span><span>Frontend académico · Fase 1</span></footer>
    </main>
  </div>

  <dialog id="recordDialog" class="modal">
    <form id="recordForm" method="dialog">
      <div class="modal-header"><div><span class="eyebrow" id="modalEyebrow">REGISTRO</span><h2 id="modalTitle">Nuevo registro</h2></div><button type="button" class="icon-button" id="closeModal" aria-label="Cerrar">×</button></div>
      <div id="modalFields" class="form-grid"></div>
      <div class="modal-actions"><button type="button" class="btn btn-secondary" id="cancelModal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar registro</button></div>
    </form>
  </dialog>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
